<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1000" viewBox="0 0 1760 1000" role="img" aria-labelledby="title desc">
<title id="title">MatPilot 多角色科研团队编排</title>
<desc id="desc">研究问题经规则路由进入单 Agent 或 Planner。协作模式下材料专家与文献专家按依赖并行或串行收集证据，Analysis 生成引用论断，经程序校验与 Reviewer 逐条复核后输出。最多重写一次，失败不发布。研究者独立审核原文与科研判断。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8290a6" stroke-width="1.6"/></marker>
<marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8961da" stroke-width="1.6"/></marker>
<symbol id="atom" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="24" cy="24" rx="21" ry="8"/><ellipse cx="24" cy="24" rx="21" ry="8" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="21" ry="8" transform="rotate(120 24 24)"/></g><circle cx="24" cy="24" r="4" fill="currentColor"/></symbol>
<symbol id="paper" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h19l8 8v30H12z M31 5v9h8 M19 22h13 M19 29h13 M19 36h8"/></g></symbol>
<symbol id="person" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="24" cy="15" r="9"/><path d="M7 43v-6c0-13 34-13 34 0v6z"/></g></symbol>
<symbol id="check" viewBox="0 0 48 48"><path d="M24 4 41 11v13c0 11-17 20-17 20S7 35 7 24V11z M15 23l6 6 12-13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
<symbol id="chart" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v37h37 M14 33v-8h6v8 M25 33V19h6v14 M36 33V12h6v21 M12 17l10-7 9 3 10-8"/></g></symbol>
</defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#23334b} .heading{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#5c6d84}.tiny{font-size:16px;fill:#5c6d84}.label{font-size:18px;font-weight:600;letter-spacing:1px}.line{fill:none;stroke:#8290a6;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.feedback{fill:none;stroke:#8961da;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#purpleArrow)}</style>
<rect width="1760" height="1000" rx="24" fill="#ffffff"/>

<text x="32" y="51" class="heading" style="fill:#315dec">MatPilot</text>
<text x="170" y="51" class="heading">多角色科研团队编排</text>
<text x="32" y="86" class="small">从研究问题到可追溯论断 · 按当前 LangGraph 协作实现绘制</text>
<rect x="1483" y="26" width="245" height="42" rx="18" fill="#eef3ff" stroke="none" stroke-width="1.6"/>
<text x="1505" y="54" class="label" style="fill:#315dec">EVIDENCE → REVIEW</text>
<rect x="32" y="130" width="245" height="110" rx="18" fill="#f5f8fc" stroke="#dbe3ed" stroke-width="1.6"/>
<use href="#person" x="50" y="150" width="35" height="35" style="color:#61738e"/>
<text x="101" y="165" class="heading">研究问题</text>
<text x="53" y="207" class="small">资料来源 / 文献范围</text>
<path d="M277 185H326" class="line"/>
<rect x="326" y="130" width="275" height="110" rx="18" fill="#f5f8fc" stroke="#dbe3ed" stroke-width="1.6"/>
<text x="350" y="168" class="heading">任务路由 · Router</text>
<text x="350" y="206" class="small">single / auto / collaborative</text>
<path d="M601 185H705" class="line"/>
<text x="618" y="168" class="tiny">协作</text>
<rect x="705" y="130" width="295" height="110" rx="18" fill="#fff6df" stroke="#edb852" stroke-width="1.6"/>
<text x="730" y="168" class="heading" style="fill:#916516">Planner · 规划</text>
<text x="730" y="206" class="small">两个专家 / 工具 / 依赖</text>
<path d="M1000 185H1080V267H680V307" class="line"/>
<text x="1022" y="168" class="tiny">结构化计划</text>
<path d="M463 130V111H1250V145" class="line"/>
<text x="802" y="103" class="tiny">简单任务 / 指定 single</text>
<rect x="1130" y="145" width="300" height="75" rx="18" fill="#f5f8fc" stroke="#dbe3ed" stroke-width="1.6"/>
<text x="1150" y="174" class="body">单 Agent · 有界工具循环</text>
<text x="1150" y="202" class="small">简单任务走独立流程</text>
<text x="32" y="293" class="label" style="fill:#61738e">01 / 数据与工具来源</text>
<text x="470" y="293" class="label" style="fill:#a77616">02 / 领域专家团队</text>
<text x="965" y="347" class="label" style="fill:#8961da">03 / 分析与程序校验</text>
<text x="1340" y="293" class="label" style="fill:#315dec">04 / 独立复核与结果</text>
<rect x="32" y="317" width="355" height="112" rx="18" fill="#f0faf7" stroke="#b3d9cd" stroke-width="1.6"/>
<use href="#atom" x="50" y="336" width="42" height="42" style="color:#259675"/>
<text x="106" y="354" class="heading" style="fill:#217c63">Materials Project</text>
<text x="106" y="386" class="body">材料属性 / 晶体结构</text>
<text x="106" y="411" class="small">计算数据 · computed</text>
<rect x="32" y="449" width="355" height="112" rx="18" fill="#f1f6ff" stroke="#bfd2f1" stroke-width="1.6"/>
<use href="#paper" x="50" y="468" width="42" height="42" style="color:#527cb7"/>
<text x="106" y="486" class="heading" style="fill:#42699c">本地论文知识库</text>
<text x="106" y="518" class="body">PDF 片段 / 页码 / 实验段落</text>
<text x="106" y="543" class="small">全文证据 · 本地检索</text>
<rect x="32" y="581" width="355" height="112" rx="18" fill="#f1f6ff" stroke="#bfd2f1" stroke-width="1.6"/>
<use href="#chart" x="50" y="600" width="42" height="42" style="color:#527cb7"/>
<text x="106" y="618" class="heading" style="fill:#42699c">实验知识库</text>
<text x="106" y="650" class="body">样品 / 条件 / 光学带隙</text>
<text x="106" y="675" class="small">候选记录 + 人工审核状态</text>
<rect x="32" y="713" width="355" height="112" rx="18" fill="#f1f6ff" stroke="#bfd2f1" stroke-width="1.6"/>
<use href="#paper" x="50" y="732" width="42" height="42" style="color:#527cb7"/>
<text x="106" y="750" class="heading" style="fill:#42699c">OpenAlex</text>
<text x="106" y="782" class="body">论文发现 / DOI / 元数据</text>
<text x="106" y="807" class="small">可选配置 · 不等于全文</text>
<rect x="470" y="317" width="420" height="508" rx="22" fill="#fffaf0" stroke="#edb852" stroke-width="1.6"/>
<rect x="490" y="341" width="380" height="155" rx="18" fill="#effaf4" stroke="#91cfac" stroke-width="1.6"/>
<use href="#atom" x="510" y="363" width="44" height="44" style="color:#259675"/>
<text x="568" y="380" class="heading" style="fill:#217c63">材料专家</text>
<text x="568" y="411" class="small">Materials Specialist</text>
<text x="510" y="451" class="body">材料查询 · 详情 · 结构 · 快照对比</text>
<text x="510" y="479" class="small">仅调用材料工具白名单</text>
<rect x="490" y="563" width="380" height="155" rx="18" fill="#eef4ff" stroke="#9bb9e5" stroke-width="1.6"/>
<use href="#paper" x="510" y="584" width="44" height="44" style="color:#527cb7"/>
<text x="568" y="602" class="heading" style="fill:#42699c">文献专家</text>
<text x="568" y="633" class="small">Literature Specialist</text>
<text x="510" y="673" class="body">检索 · 实验记录 · 跨论文分析</text>
<text x="510" y="701" class="small">仅调用文献工具白名单</text>
<path d="M680 496V563" class="line"/>
<text x="702" y="535" class="tiny">无依赖并行 / 有依赖串行</text>
<text x="497" y="759" class="heading" style="fill:#916516">返回结构化工具证据</text>
<text x="497" y="793" class="small">保留 source_id、参数与执行状态</text>
<path d="M387 373H437Q450 373 450 386V418H490" class="line"/>
<path d="M387 505H411Q425 505 425 519V640H490" class="line"/>
<path d="M387 637H425" class="line" style="marker-end:none"/>
<path d="M387 769H410Q425 769 425 754V640" class="line" style="marker-end:none"/>
<path d="M890 571H965" class="line"/>
<text x="900" y="548" class="tiny">证据</text>
<rect x="965" y="374" width="300" height="316" rx="22" fill="#f6f1ff" stroke="#b297e5" stroke-width="1.6"/>
<use href="#chart" x="988" y="399" width="45" height="45" style="color:#8961da"/>
<text x="1049" y="421" class="heading" style="fill:#7751bc">Analysis</text>
<text x="988" y="469" class="body">比较、归纳与论断选择</text>
<text x="988" y="507" class="small">引用来源 ID + 连续行号</text>
<text x="988" y="539" class="small">程序复制原文摘录</text>
<rect x="985" y="564" width="260" height="104" rx="12" fill="#ffffff" stroke="#d7c9ee" stroke-width="1.6"/>
<text x="1001" y="593" class="body" style="fill:#7751bc">程序校验</text>
<text x="1001" y="623" class="tiny">引用范围 / 数值 / 方法来源</text>
<text x="1001" y="650" class="tiny">计算与实验边界</text>
<path d="M1265 439H1340" class="line"/>
<text x="1277" y="420" class="tiny">候选</text>
<rect x="1340" y="317" width="388" height="207" rx="22" fill="#f0f5ff" stroke="#7b9ee3" stroke-width="1.6"/>
<use href="#check" x="1362" y="338" width="43" height="43" style="color:#527cce"/>
<text x="1418" y="363" class="heading" style="fill:#4269b2">Reviewer · 独立复核</text>
<text x="1364" y="411" class="body">逐条检查样品、属性、数值与单位</text>
<text x="1364" y="447" class="small">每个 claim 恰好复核一次</text>
<text x="1364" y="485" class="small">检查引文支持与比较局限</text>
<path d="M1340 493H1304V737H1115V690" class="feedback"/>
<text x="994" y="768" class="small" style="fill:#7751bc">未通过：反馈 → 最多重写一次</text>
<text x="994" y="796" class="tiny">复用已有证据，不重复专家查询</text>
<path d="M1534 524V571" class="line"/>
<text x="1552" y="555" class="tiny">通过</text>
<rect x="1340" y="571" width="388" height="126" rx="20" fill="#4e76ec" stroke="none" stroke-width="1.6"/>
<text x="1365" y="610" class="heading" style="fill:#ffffff">引用式答案 + 任务轨迹</text>
<text x="1365" y="648" class="small" style="fill:#ffffff">结论 / 引文 / 工具记录 / 复核结果</text>
<text x="1365" y="677" class="tiny" style="fill:#e6edff">证据不足：明确返回不足状态</text>
<path d="M1534 697V739" class="line"/>
<rect x="1340" y="739" width="388" height="86" rx="18" fill="#f5f8fc" stroke="#cbd7e8" stroke-width="1.6"/>
<use href="#person" x="1363" y="759" width="40" height="40" style="color:#61738e"/>
<text x="1418" y="775" class="heading">研究者 · 科研判断</text>
<text x="1418" y="804" class="small">回看原文，独立审核与使用</text>
<rect x="32" y="868" width="1696" height="101" rx="18" fill="#f5f7fb" stroke="#dbe3ed" stroke-width="1.6"/>
<text x="55" y="903" class="heading">协作运行约束</text>
<text x="265" y="903" class="body">默认 10 次模型调用 · 全局最多 8 次工具调用 · 默认 240 秒步骤间时间预算</text>
<text x="55" y="943" class="small">阶段 checkpoint + 工具与复核轨迹落盘；校验或复核仍失败、预算耗尽时返回错误，不发布未经通过的候选。</text>
</svg>
