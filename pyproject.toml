[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matpilot"
version = "0.1.0.dev0"
description = "Evidence-based materials research with RAG and agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "mp-api>=0.45,<1",
    "pymatgen>=2025.1",
    "pandas>=2.2,<4",
    "pymupdf>=1.25,<2",
    "pdfplumber>=0.11,<1",
    "python-multipart>=0.0.20,<1",
    "langgraph>=1,<2",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.43",
]

[project.optional-dependencies]
ui = ["streamlit>=1.65,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3", "pgvector>=0.4,<1"]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Regional PyPI mirror avoids stalled large-source downloads on this Windows host.
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires configured external services",
    "api: runs ASGI HTTP and lifespan through an async event loop",
]
faulthandler_timeout = 30

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
